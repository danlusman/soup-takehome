# (c) BROKEN TEMPLATE: identical to real.yaml except chat_template + output (D-15). Every key verified against soup_cli/config/schema.py (soup-cli 0.77.2).
# Rationale per key: DECISIONS.md D-10, D-11, D-13.
base: Qwen/Qwen2.5-1.5B-Instruct
task: sft
backend: transformers

data:
  train: data/processed/trainval_soup.jsonl   # train (1500) + val (150) appended LAST
  format: chatml                              # {"messages": [...]}; explicit, not auto-detected
  val_split: 0.0909                           # Soup takes the last 9.09% = exactly our 150 val rows
  max_length: 512                             # prepare_data dropped every row longer than this
  train_on_responses_only: true               # loss on assistant tokens only (Soup default, stated)
  chat_template: qwen2.5          # BROKEN ON PURPOSE: Soup maps it to plain ChatML, no default system prompt (D-15)

training:
  epochs: 2
  lr: 2.0e-4
  batch_size: 4                  # explicit: "auto" would probe until OOM (CONCERNS C-15)
  gradient_accumulation_steps: 4 # effective batch 16 -> ~94 optimizer steps/epoch
  warmup_ratio: 0.05
  scheduler: cosine
  weight_decay: 0.0
  max_grad_norm: 1.0
  optimizer: adamw_torch
  seed: 42
  data_seed: 42
  quantization: none             # fp16 base, NOT Soup's default 4bit QLoRA (D-10)
  gradient_checkpointing: true
  logging_steps: 1               # every optimizer step: loss, grad_norm, lr
  eval_steps: 20
  save_steps: 50
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

output: outputs/broken_template
